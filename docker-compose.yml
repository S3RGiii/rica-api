name: rica

# Infraestructura del taller L5-L11.
# Levanta solo las dependencias (bases, broker, registro); los servicios
# se arrancan con mvnw o con el perfil "app" de este mismo archivo.
#
#   docker compose up -d postgres mongodb kafka eureka
#   docker compose --profile app up -d --build
#
services:

  postgres:
    image: postgres:16-alpine
    container_name: rica-postgres
    environment:
      POSTGRES_DB: rica
      POSTGRES_USER: rica
      POSTGRES_PASSWORD: rica
    ports:
      - "5432:5432"
    volumes:
      - rica-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rica -d rica"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: rica-mongodb
    ports:
      - "27017:27017"
    volumes:
      - rica-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: rica-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: rica-kraft-cluster-01
    volumes:
      - rica-kafka:/var/lib/kafka/data

  eureka:
    build: ./eureka-server
    container_name: rica-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway:
    profiles: ["app"]
    build: ./gateway
    container_name: rica-gateway
    ports:
      - "8000:8000"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    depends_on:
      - eureka

  investigadores-service:
    profiles: ["app"]
    build: ./investigadores-service
    container_name: rica-investigadores
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rica
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      eureka:
        condition: service_started

  publicaciones-service:
    profiles: ["app"]
    build: ./publicaciones-service
    container_name: rica-publicaciones
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/rica
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_GRPC_CLIENT_CHANNEL_INVESTIGADORES_TARGET: static://investigadores-service:9090
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    depends_on:
      mongodb:
        condition: service_healthy
      investigadores-service:
        condition: service_started

  consultas-service:
    profiles: ["app"]
    build: ./consultas-service
    container_name: rica-consultas
    ports:
      - "8083:8083"
    environment:
      SPRING_MONGODB_URI: mongodb://mongodb:27017/rica_consultas
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  rica-postgres:
  rica-mongodb:
  rica-kafka:
